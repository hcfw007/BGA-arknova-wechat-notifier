name: Publish

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 与 Dockerfile 的 node:20-alpine 保持一致
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run dist

      - name: Type-check tests
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Unit tests
        run: npm test

  publish:
    name: Publish
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to DockerHub Registry
        run: echo ${{ secrets.DOCKER_PERSONAL_ACCESS_TOKEN }} | docker login -u hcfw007 --password-stdin

      - name: Resolve the image tags from package.json
        id: image
        run: |
          REPO=hcfw007/bga-arknova-wechat-notifier
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$REPO:$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # 三种情况：版本没发过就构建；发过但 :latest 没指向它就只补 tag；都到位就跳过。
      # 版本没变的提交（改文档、改 CI 等）因此不会重新构建并覆盖已发布的镜像。
      # digest 取不到一律当作「缺失」——网络或鉴权抖动会多做一次构建/打 tag，
      # 宁可白做一次，也不能因为一次误判把该发的版本跳过。
      - name: Decide what needs publishing
        id: plan
        run: |
          # 归一化到底层 manifest 再比较：`imagetools create` 会把源 manifest 包一层
          # manifest list，:latest 的顶层 digest 因此永远不等于版本 tag 的，
          # 直接比会导致每次推送都重复 retag，skip 分支形同虚设。
          digest() {
            raw=$(docker buildx imagetools inspect --raw "$1" 2>/dev/null) || return 0
            child=$(printf '%s' "$raw" | jq -r '.manifests[0].digest // empty')
            if [ -n "$child" ]; then
              printf '%s' "$child"
            else
              docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>/dev/null || true
            fi
          }
          VERSION_DIGEST=$(digest "${{ steps.image.outputs.ref }}")
          LATEST_DIGEST=$(digest "${{ steps.image.outputs.repo }}:latest")

          if [ -z "$VERSION_DIGEST" ]; then
            echo "action=build" >> "$GITHUB_OUTPUT"
          elif [ "$VERSION_DIGEST" != "$LATEST_DIGEST" ]; then
            echo "action=retag" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.image.outputs.ref }} exists; moving :latest onto it"
          else
            echo "action=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.image.outputs.ref }} and :latest are both current, nothing to publish"
          fi

      - name: Build the Docker image & Upload to DockerHub
        if: steps.plan.outputs.action == 'build'
        run: |
          docker build \
            -t "${{ steps.image.outputs.ref }}" \
            -t "${{ steps.image.outputs.repo }}:latest" .
          docker push "${{ steps.image.outputs.ref }}"
          docker push "${{ steps.image.outputs.repo }}:latest"

      # registry 侧直接复制 manifest，不重新构建也不拉取镜像
      - name: Point :latest at the current version
        if: steps.plan.outputs.action == 'retag'
        run: |
          docker buildx imagetools create \
            -t "${{ steps.image.outputs.repo }}:latest" \
            "${{ steps.image.outputs.ref }}"
