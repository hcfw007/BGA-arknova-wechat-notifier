name: Publish

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 与 Dockerfile 的 node:20-alpine 保持一致
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run dist

      - name: Type-check tests
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Unit tests
        run: npm test

  publish:
    name: Publish
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to DockerHub Registry
        run: echo ${{ secrets.DOCKER_PERSONAL_ACCESS_TOKEN }} | docker login -u hcfw007 --password-stdin

      - name: Resolve the image tag from package.json
        id: image
        run: echo "ref=hcfw007/bga-arknova-wechat-notifier:$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # 版本没变的提交（改文档、改 CI 等）不该重新构建并覆盖已发布的镜像。
      # 只有 inspect 成功才判定「已存在」——网络或鉴权抖动会走到 else 去构建，
      # 宁可白构建一次，也不能因为一次误判把该发的版本跳过。
      - name: Check whether the tag is already published
        id: published
        run: |
          if docker manifest inspect "${{ steps.image.outputs.ref }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.image.outputs.ref }} already published, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Docker image & Upload to DockerHub
        if: steps.published.outputs.exists == 'false'
        run: |
          docker build -t "${{ steps.image.outputs.ref }}" .
          docker push "${{ steps.image.outputs.ref }}"
